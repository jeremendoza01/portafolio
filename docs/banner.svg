<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <radialGradient id="glow" cx="68%" cy="48%" r="58%">
      <stop offset="0%" stop-color="#c8ff2e" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#c8ff2e" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8ff2e" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#c8ff2e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c8ff2e" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="blur" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
      .disp { font-family: "Syne", "Segoe UI", system-ui, sans-serif; font-weight: 800; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .eq1 { animation: eq 1.1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
      .eq2 { animation: eq 0.85s ease-in-out -0.3s infinite alternate; transform-box: fill-box; transform-origin: bottom; }
      .eq3 { animation: eq 1.3s ease-in-out -0.6s infinite alternate; transform-box: fill-box; transform-origin: bottom; }
      .eq4 { animation: eq 0.95s ease-in-out -0.2s infinite alternate; transform-box: fill-box; transform-origin: bottom; }
      .eq5 { animation: eq 1.2s ease-in-out -0.8s infinite alternate; transform-box: fill-box; transform-origin: bottom; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes eq { 0% { transform: scaleY(0.25); } 100% { transform: scaleY(1); } }
    </style>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="360" rx="22" fill="#0a0a0c"/>
  <rect width="1200" height="360" rx="22" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="21.5" fill="none" stroke="rgba(255,255,255,0.1)"/>

  <!-- Trastes del diapasón -->
  <g stroke="rgba(255,255,255,0.045)" stroke-width="1">
    <line x1="180" y1="68" x2="180" y2="292"/>
    <line x1="340" y1="68" x2="340" y2="292"/>
    <line x1="485" y1="68" x2="485" y2="292"/>
    <line x1="620" y1="68" x2="620" y2="292"/>
    <line x1="745" y1="68" x2="745" y2="292"/>
    <line x1="860" y1="68" x2="860" y2="292"/>
    <line x1="970" y1="68" x2="970" y2="292"/>
    <line x1="1070" y1="68" x2="1070" y2="292"/>
  </g>
  <!-- Inlays de traste -->
  <g fill="rgba(255,255,255,0.06)">
    <circle cx="412" cy="180" r="4.5"/>
    <circle cx="682" cy="180" r="4.5"/>
    <circle cx="915" cy="180" r="4.5"/>
  </g>

  <!-- 6 Cuerdas de guitarra (e B G D A E) -->
  <g>
    <line x1="0" y1="95" x2="1200" y2="95" stroke="rgba(236,235,230,0.12)" stroke-width="1"/>
    <line x1="0" y1="129" x2="1200" y2="129" stroke="rgba(236,235,230,0.14)" stroke-width="1.2"/>
    <line x1="0" y1="163" x2="1200" y2="163" stroke="rgba(236,235,230,0.16)" stroke-width="1.5"/>
    <line x1="0" y1="197" x2="1200" y2="197" stroke="rgba(236,235,230,0.18)" stroke-width="1.9"/>
    <line x1="0" y1="231" x2="1200" y2="231" stroke="rgba(236,235,230,0.20)" stroke-width="2.3"/>

    <!-- 6ª cuerda (E) vibrando animada con brillo -->
    <path d="M0,265 Q600,265 1200,265" fill="none" stroke="url(#strGlow)" stroke-width="8" opacity="0.45" filter="url(#blur)">
      <animate attributeName="d" dur="2.6s" repeatCount="indefinite"
        values="M0,265 Q520,247 1200,265; M0,265 Q520,283 1200,265; M0,265 Q520,255 1200,265; M0,265 Q520,275 1200,265; M0,265 Q520,265 1200,265; M0,265 Q520,247 1200,265"/>
    </path>
    <path d="M0,265 Q600,265 1200,265" fill="none" stroke="#c8ff2e" stroke-width="2.8">
      <animate attributeName="d" dur="2.6s" repeatCount="indefinite"
        values="M0,265 Q520,247 1200,265; M0,265 Q520,283 1200,265; M0,265 Q520,255 1200,265; M0,265 Q520,275 1200,265; M0,265 Q520,265 1200,265; M0,265 Q520,247 1200,265"/>
    </path>
  </g>

  <!-- Etiquetas de cuerdas -->
  <g class="mono" font-size="11" fill="rgba(141,141,151,0.55)">
    <text x="20" y="90">e</text>
    <text x="20" y="124">B</text>
    <text x="20" y="158">G</text>
    <text x="20" y="192">D</text>
    <text x="20" y="226">A</text>
    <text x="20" y="260" fill="#c8ff2e" font-weight="700">E</text>
  </g>

  <!-- Top bar del banner -->
  <g transform="translate(64, 34)">
    <circle cx="18" cy="18" r="17" fill="none" stroke="#c8ff2e" stroke-width="1.8"/>
    <circle cx="18" cy="18" r="13.5" fill="none" stroke="#c8ff2e" stroke-width="0.9" opacity="0.55"/>
    <text x="18" y="22.5" text-anchor="middle" fill="#c8ff2e" class="mono" font-size="11" font-weight="700">JM</text>
    <text x="48" y="23" fill="#ecebe6" class="mono" font-size="14" font-weight="700">jere<tspan fill="#c8ff2e">.</tspan>dev</text>
  </g>

  <!-- Pill derecha -->
  <g transform="translate(886, 36)">
    <rect width="250" height="30" rx="15" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="18" cy="15" r="4" fill="#c8ff2e" class="pulse"/>
    <text x="32" y="19" fill="#8d8d97" class="mono" font-size="11">REACT 19 · TAILWIND v4 · AUDIO</text>
  </g>

  <!-- Tipografía principal -->
  <g transform="translate(64, 152)">
    <text x="0" y="-26" class="mono" font-size="12.5" fill="#8d8d97">
      <tspan fill="#c8ff2e">//</tspan> portfolio interactivo · Villa Mercedes, San Luis, AR
    </text>
    <text x="0" y="34" class="disp" font-size="76" letter-spacing="-2.5" fill="#ecebe6">JEREMÍAS</text>
    <text x="42" y="102" class="disp" font-size="76" letter-spacing="-2.5" fill="none" stroke="#ecebe6" stroke-width="1.5">MENDOZA</text>
  </g>

  <!-- Mini panel rig / VU meter derecha -->
  <g transform="translate(825, 118)">
    <rect width="311" height="126" rx="16" fill="#111116" fill-opacity="0.92" stroke="rgba(255,255,255,0.14)"/>
    <text x="20" y="28" class="mono" font-size="10" fill="#8d8d97" letter-spacing="1.5">JM-24 ROCK / SYNTH RIG</text>
    <circle cx="288" cy="24" r="4" fill="#c8ff2e" class="pulse"/>

    <!-- LCD interno -->
    <rect x="18" y="40" width="275" height="44" rx="8" fill="#07090a" stroke="#23262a"/>
    <text x="30" y="58" class="mono" font-size="9.5" fill="#c8ff2e" opacity="0.75">▶ SODA STEREO (AR) · 124 BPM</text>
    <text x="30" y="75" class="mono" font-size="13.5" font-weight="700" fill="#c8ff2e">De Música Ligera</text>

    <!-- Barras ecualizador -->
    <g transform="translate(230, 48)" fill="#c8ff2e">
      <rect x="0" y="4" width="6" height="24" rx="2" class="eq1"/>
      <rect x="10" y="4" width="6" height="24" rx="2" class="eq2"/>
      <rect x="20" y="4" width="6" height="24" rx="2" class="eq3"/>
      <rect x="30" y="4" width="6" height="24" rx="2" class="eq4"/>
      <rect x="40" y="4" width="6" height="24" rx="2" class="eq5"/>
    </g>

    <text x="20" y="108" class="mono" font-size="10.5" fill="#8d8d97">
      6 cuerdas físicas · 24 teclas · 7 riffs
    </text>
  </g>

  <!-- Pie del banner -->
  <text x="64" y="324" class="mono" font-size="11.5" fill="#8d8d97">
    código, rock argentino y guitarras · <tspan fill="#c8ff2e">Bm → G → D → A</tspan>
  </text>
  <text x="1136" y="324" text-anchor="end" class="mono" font-size="11.5" fill="#8d8d97">
    github.com/<tspan fill="#ecebe6">jeremendoza01</tspan>
  </text>
</svg>
