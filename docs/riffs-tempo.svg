<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320">
  <defs>
    <linearGradient id="barAr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8ff2e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c8ff2e"/>
    </linearGradient>
    <linearGradient id="barInt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5ce1ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5ce1ff"/>
    </linearGradient>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
      .name { font-family: "Manrope", "Segoe UI", system-ui, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <rect width="1100" height="320" rx="18" fill="#0d0d11" stroke="rgba(255,255,255,0.1)"/>
  <text x="28" y="34" class="mono" font-size="11" fill="#8d8d97" letter-spacing="1.4">
    <tspan fill="#c8ff2e">♫</tspan> SETLIST INTERACTIVO JM-24 · TEMPOS BPM ORIGINALES DE ESTUDIO
  </text>

  <!-- Leyenda -->
  <g transform="translate(830, 22)" class="mono" font-size="10.5" fill="#8d8d97">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#c8ff2e"/>
    <text x="16" y="9">Rock Argentino</text>
    <rect x="132" y="0" width="10" height="10" rx="2" fill="#5ce1ff"/>
    <text x="148" y="9">Clásicos UK/US</text>
  </g>

  <!-- Filas (escala 0..170 BPM => ancho barra max 560px en x=390) -->
  <!-- 1. Ji Ji Ji - 158 BPM -->
  <g transform="translate(28, 62)">
    <text x="0" y="16" class="name" font-size="14" fill="#ecebe6">Ji Ji Ji</text>
    <text x="180" y="16" class="mono" font-size="11.5" fill="#8d8d97">Los Redondos · AR</text>
    <rect x="360" y="4" width="560" height="16" rx="8" fill="#17171e"/>
    <rect x="360" y="4" width="520" height="16" rx="8" fill="url(#barAr)"/>
    <text x="940" y="16" class="mono" font-size="12.5" font-weight="700" fill="#c8ff2e">158 BPM</text>
  </g>

  <!-- 2. De Música Ligera - 124 BPM -->
  <g transform="translate(28, 98)">
    <text x="0" y="16" class="name" font-size="14" fill="#ecebe6">De Música Ligera</text>
    <text x="180" y="16" class="mono" font-size="11.5" fill="#8d8d97">Soda Stereo · AR</text>
    <rect x="360" y="4" width="560" height="16" rx="8" fill="#17171e"/>
    <rect x="360" y="4" width="408" height="16" rx="8" fill="url(#barAr)"/>
    <text x="940" y="16" class="mono" font-size="12.5" font-weight="700" fill="#c8ff2e">124 BPM</text>
  </g>

  <!-- 3. Seven Nation Army - 124 BPM -->
  <g transform="translate(28, 134)">
    <text x="0" y="16" class="name" font-size="14" fill="#ecebe6">Seven Nation Army</text>
    <text x="180" y="16" class="mono" font-size="11.5" fill="#8d8d97">The White Stripes · US</text>
    <rect x="360" y="4" width="560" height="16" rx="8" fill="#17171e"/>
    <rect x="360" y="4" width="408" height="16" rx="8" fill="url(#barInt)"/>
    <text x="940" y="16" class="mono" font-size="12.5" font-weight="700" fill="#5ce1ff">124 BPM</text>
  </g>

  <!-- 4. Come As You Are - 120 BPM -->
  <g transform="translate(28, 170)">
    <text x="0" y="16" class="name" font-size="14" fill="#ecebe6">Come As You Are</text>
    <text x="180" y="16" class="mono" font-size="11.5" fill="#8d8d97">Nirvana · US</text>
    <rect x="360" y="4" width="560" height="16" rx="8" fill="#17171e"/>
    <rect x="360" y="4" width="395" height="16" rx="8" fill="url(#barInt)"/>
    <text x="940" y="16" class="mono" font-size="12.5" font-weight="700" fill="#5ce1ff">120 BPM</text>
  </g>

  <!-- 5. Lamento Boliviano - 115 BPM -->
  <g transform="translate(28, 206)">
    <text x="0" y="16" class="name" font-size="14" fill="#ecebe6">Lamento Boliviano</text>
    <text x="180" y="16" class="mono" font-size="11.5" fill="#8d8d97">Enanitos Verdes · AR</text>
    <rect x="360" y="4" width="560" height="16" rx="8" fill="#17171e"/>
    <rect x="360" y="4" width="379" height="16" rx="8" fill="url(#barAr)"/>
    <text x="940" y="16" class="mono" font-size="12.5" font-weight="700" fill="#c8ff2e">115 BPM</text>
  </g>

  <!-- 6. Smoke on the Water - 114 BPM -->
  <g transform="translate(28, 242)">
    <text x="0" y="16" class="name" font-size="14" fill="#ecebe6">Smoke on the Water</text>
    <text x="180" y="16" class="mono" font-size="11.5" fill="#8d8d97">Deep Purple · UK</text>
    <rect x="360" y="4" width="560" height="16" rx="8" fill="#17171e"/>
    <rect x="360" y="4" width="375" height="16" rx="8" fill="url(#barInt)"/>
    <text x="940" y="16" class="mono" font-size="12.5" font-weight="700" fill="#5ce1ff">114 BPM</text>
  </g>

  <!-- 7. Persiana Americana - 103 BPM -->
  <g transform="translate(28, 278)">
    <text x="0" y="16" class="name" font-size="14" fill="#ecebe6">Persiana Americana</text>
    <text x="180" y="16" class="mono" font-size="11.5" fill="#8d8d97">Soda Stereo · AR</text>
    <rect x="360" y="4" width="560" height="16" rx="8" fill="#17171e"/>
    <rect x="360" y="4" width="339" height="16" rx="8" fill="url(#barAr)"/>
    <text x="940" y="16" class="mono" font-size="12.5" font-weight="700" fill="#c8ff2e">103 BPM</text>
  </g>
</svg>
